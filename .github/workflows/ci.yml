name: ci

# Quality gates for every PR and every push to main. The job names `verify` and `e2e`
# are required status checks in the `main-integrity` ruleset: renaming a job requires
# updating the ruleset in the same change (plan §5.1). No publish or deploy steps.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps a final status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Types, brand rules, unit tests with coverage, library build, size budget and catalog build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npm run test:build
      - run: npm run size
      - run: npm run build-storybook

  # Playwright against the built catalog on the pinned container (tag + digest), so browser
  # and fonts are deterministic for visual baselines (plan §5.4). The image version must equal
  # the @playwright/test version; the first step enforces it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      # The image runs as root; browsers refuse a HOME owned by another user.
      HOME: /root
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Assert Playwright image parity
        run: |
          installed=$(node -p 'require("@playwright/test/package.json").version')
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test $installed != container image $PLAYWRIGHT_IMAGE_VERSION — bump both together."
            exit 1
          fi
      - run: npm run build-storybook
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
