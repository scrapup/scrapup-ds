name: ci

# Quality gates for every PR and every push to main. The job names `verify` and `e2e`
# are required status checks in the `main-integrity` ruleset: renaming a job requires
# updating the ruleset in the same change (plan §5.1). No publish or deploy steps.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, brand rules, unit tests with coverage, library build, size budget and catalog build.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json");
            const rows = ["lines", "branches", "functions", "statements"]
              .map((k) => `| ${k} | ${total[k].pct}% |`).join("\n");
            process.stdout.write(`### Unit coverage\n\n| Metric | Covered |\n|---|---:|\n${rows}\n`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npm run size
      - run: npm run build-storybook

  # Playwright against the built catalog on the pinned container, so browser and fonts
  # are deterministic for visual baselines (plan §5.4). Keep the image tag equal to
  # the @playwright/test version.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
