name: release-please

# On push to main: open/maintain the Release PR. Merging it creates the `vX.Y.Z`
# tag and GitHub release (the only way tags are created, RN-20). No publish or
# deploy steps: consumers install from Git tags (RN-05).

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
